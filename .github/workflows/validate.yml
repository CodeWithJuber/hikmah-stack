name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate package
        run: python3 scripts/validate.py
      - name: Compile hook
        run: python3 -m py_compile hooks/truth_gate.py
