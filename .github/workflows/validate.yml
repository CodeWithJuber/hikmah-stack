name: validate

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate package
        run: python3 scripts/validate.py
      - name: Compile hook
        run: python3 -m py_compile hooks/truth_gate.py

  bootstrap-v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore patch base and verify payload
        run: |
          git checkout eb2b88dc341b7c6d064e5e7c655336300095e663 -- .github/workflows/validate.yml
          cat .hikmah-bootstrap/chunk-* | base64 -d | gzip -d > /tmp/hikmah-v3.patch
          echo 'd43b3dddc542c220eac5f60eedad6d9ca7aaa3242d18603620b56a970dbe19d5  /tmp/hikmah-v3.patch' | sha256sum -c -
      - name: Apply v3 patch
        run: |
          git apply --index /tmp/hikmah-v3.patch
          git rm -r .hikmah-bootstrap .github/workflows/bootstrap-hikmah-v3.yml
      - name: Apply compiler-review fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          trace = Path('runtime/hikmah-kernel/src/trace.rs')
          text = trace.read_text()
          text = text.replace(
              '#[derive(Debug, Clone, Copy, Serialize, Deserialize, PartialEq, Eq)]\n#[serde(rename_all = "snake_case")]\npub enum PrivacyClass {\n    Public,\n    Private,\n    Sensitive,\n}\n\nimpl Default for PrivacyClass {\n    fn default() -> Self {\n        Self::Private\n    }\n}\n',
              '#[derive(Debug, Clone, Copy, Serialize, Deserialize, PartialEq, Eq, Default)]\n#[serde(rename_all = "snake_case")]\npub enum PrivacyClass {\n    Public,\n    #[default]\n    Private,\n    Sensitive,\n}\n'
          )
          trace.write_text(text)

          validate = Path('runtime/hikmah-kernel/src/validate.rs')
          text = validate.read_text()
          text = text.replace(
              '    for path in [".claude-plugin/plugin.json"] {\n        let other = plugin_version(root.join(path))?;\n        if other != version {\n            return Err(KernelError::Invalid(format!(\n                "manifest version mismatch: {path} has {other}, expected {version}"\n            )));\n        }\n    }\n',
              '    let path = ".claude-plugin/plugin.json";\n    let other = plugin_version(root.join(path))?;\n    if other != version {\n        return Err(KernelError::Invalid(format!(\n            "manifest version mismatch: {path} has {other}, expected {version}"\n        )));\n    }\n'
          )
          validate.write_text(text)
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Format
        run: cargo fmt --all
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Validate package
        run: cargo run -p hikmah-kernel -- validate --root .
      - name: Check Python compatibility fallback
        run: python3 -m py_compile hooks/truth_gate.py
      - name: Commit validated v3 tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Hikmah Stack v3.0.0 cognitive kernel"
          git push origin HEAD:agent/cognitive-kernel-v3
