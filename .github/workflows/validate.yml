name: validate

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate package
        run: python3 scripts/validate.py
      - name: Compile hook
        run: python3 -m py_compile hooks/truth_gate.py

  bootstrap-v3:
    if: github.ref == 'refs/heads/agent/cognitive-kernel-v3' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore patch base and verify payload
        run: |
          git checkout eb2b88dc341b7c6d064e5e7c655336300095e663 -- .github/workflows/validate.yml
          cat .hikmah-bootstrap/chunk-* | base64 -d | gzip -d > /tmp/hikmah-v3.patch
          echo 'd43b3dddc542c220eac5f60eedad6d9ca7aaa3242d18603620b56a970dbe19d5  /tmp/hikmah-v3.patch' | sha256sum -c -
      - name: Apply v3 patch
        run: |
          git apply --index /tmp/hikmah-v3.patch
          git rm -r .hikmah-bootstrap .github/workflows/bootstrap-hikmah-v3.yml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Format
        run: cargo fmt --all
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Validate package
        run: cargo run -p hikmah-kernel -- validate --root .
      - name: Check Python compatibility fallback
        run: python3 -m py_compile hooks/truth_gate.py
      - name: Commit validated v3 tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Hikmah Stack v3.0.0 cognitive kernel"
          git push origin HEAD:agent/cognitive-kernel-v3
