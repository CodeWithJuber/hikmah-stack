name: bootstrap-hikmah-v3

on:
  push:
    branches:
      - agent/cognitive-kernel-v3
    paths:
      - .hikmah-bootstrap/READY
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-build-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and apply v3 patch
        run: |
          cat .hikmah-bootstrap/chunk-* | base64 -d | gzip -d > /tmp/hikmah-v3.patch
          git apply --index /tmp/hikmah-v3.patch
          git rm -r .hikmah-bootstrap .github/workflows/bootstrap-hikmah-v3.yml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: Format
        run: cargo fmt --all
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Validate package
        run: cargo run -p hikmah-kernel -- validate --root .
      - name: Check Python compatibility fallback
        run: python3 -m py_compile hooks/truth_gate.py
      - name: Commit validated v3 tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Hikmah Stack v3.0.0 cognitive kernel"
          git push origin HEAD:agent/cognitive-kernel-v3
