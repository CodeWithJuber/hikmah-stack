name: Bug report
description: Report a plugin loading, trigger, hook, or behavior problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the prompt/trigger and observed behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: claude-version
    attributes:
      label: Claude Code version
  - type: textarea
    id: evidence
    attributes:
      label: Logs or validation output
      description: Remove secrets before posting.
