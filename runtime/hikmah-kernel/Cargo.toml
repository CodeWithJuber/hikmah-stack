[package]
name = "hikmah-kernel"
version = "3.0.0"
edition = "2021"
description = "Deterministic co-model runtime for Hikmah Stack"
license = "MIT"
repository = "https://github.com/CodeWithJuber/hikmah-stack"

[lib]
name = "hikmah_kernel"
path = "src/lib.rs"

[[bin]]
name = "hikmah"
path = "src/main.rs"

[dependencies]
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
