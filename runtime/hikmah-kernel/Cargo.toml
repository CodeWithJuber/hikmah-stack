[package]
name = "hikmah-kernel"
version = "3.1.0"
edition = "2021"
rust-version = "1.89"
description = "Deterministic co-model runtime for Hikmah Stack"
license = "MIT"
repository = "https://github.com/CodeWithJuber/hikmah-stack"

[lib]
name = "hikmah_kernel"
path = "src/lib.rs"

[[bin]]
name = "hikmah"
path = "src/main.rs"

[features]
default = ["jev"]
# TypeSafe Jev (System One) adapter for the typed decision port. Network egress happens
# only when an engine is explicitly selected and TYPESAFE_API_KEY is set.
jev = ["dep:ureq"]

[dependencies]
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
unicode-normalization = "0.1"
ureq = { version = "3", features = ["json", "platform-verifier"], optional = true }
